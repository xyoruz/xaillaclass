name: Build Xailla APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
          
      # INI ADALAH BARIS AJAIB YANG MEMBUAT FOLDER ANDROID
      - name: Generate missing Android files
        run: flutter create . --project-name xaillaclass --org com.xailla
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xailla-Class-APK
          path: build/app/outputs/flutter-apk/app-release.apk
