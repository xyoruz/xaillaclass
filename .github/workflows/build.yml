name: Build Xailla VPN APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
          
      - name: Generate missing Android files
        run: flutter create . --project-name xaillaclass --org com.xailla
          
      - name: Install Dependencies
        run: flutter pub get

      # Perbaikan Manifest untuk Izin VPN
      - name: Patch AndroidManifest for VPN
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          cat << 'MANIFEST' > $FILE
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.xailla.xaillaclass">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:label="Xailla Class"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <service android:name="com.github.xiaokang.flutter_v2ray.V2rayVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          MANIFEST
          
      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xailla-Elegant-VPN
          path: build/app/outputs/flutter-apk/app-release.apk
