name: Build Xailla VPN APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
          
      - name: Generate missing Android files
        run: flutter create . --project-name xaillaclass --org com.xailla
          
      - name: Install Dependencies
        run: flutter pub get

      # MENAMBAHKAN IZIN VPN & SERVICE KE ANDROIDMANIFEST.XML
      - name: Inject VPN Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Tambah izin internet dan VPN
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' $MANIFEST
          # Tambah service V2Ray (Wajib untuk VPN)
          sed -i '/<\/application>/i \        <service android:name="com.github.xiaokang.flutter_v2ray.V2rayVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>' $MANIFEST
          
      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xailla-VPN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
